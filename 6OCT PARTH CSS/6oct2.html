<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #E7E9EB;

        }
        #mydiv{
            width: 100%;
            height: 300px;
            position: absolute;
            background-color: #FFFFFF;
        }
        #mydiv div{
            width: 100px;
            height:100px;
            position: absolute;
            background-color: yellow;
            border: 1px solid black;
            opacity: 0.5;
        }
        #mybox {
            position: absolute;
            background-color: rgb(225, 67, 67)!important;
            opacity: 1!important;
            z-index: 2;
            
        }
    </style>
</head>
<body>
    <h1>The z-index Property</h1>
    <div id="mydiv">
        <div id="mybox">my Box </div>
        <div style="top:20px;left:20px;z-index:0;">z-index: 0</div>
        <div style="top:40px; left:40px;z-index:1;">z-index: 1</div>
        <div style="top:60px;left:60px;z-index:2;">z-index: 2</div>
        <div style="top:80px;left:80;z-index:3;">z-index: 3</div>
    </div>
</body>
</html>
