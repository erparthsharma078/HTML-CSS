<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(193, 193, 83);

        }
        #mydiv{
            width: 100px;
            height: 100px;
            position: absolute;
            background-color: rgb(161, 127, 255);
        }
       #mydiv div{
            width: 100px;
            height:100px;
            position: absolute;
            background-color:rgb(237, 45, 205) ;
            border: 1px solid black;
            opacity: 0.5;
        }
        #mybox {
            position: absolute;
            background-color: rgb(245, 240, 241)!important;
            opacity: 1!important;
            z-index: 2;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>welcome to my collage</h1>
    <div id="mydiv">
        <div id="mybox">my div1 </div>
        <div style="top:20px;left:20px;z-index:0;">di1</div>
        <div style="top:40px; left:40px;z-index:1;">di2</div>
        <div style="top:60px;left:60px;z-index:2;">di3</div>
        <div style="top:80px;left:80;z-index:3;">div4</div>
    </div>
</body>
</html>
